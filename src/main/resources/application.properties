spring.application.name=Monomat-BE
spring.profiles.active=dev
spring.config.import=optional:file:.env[.properties]

auth.jwt.secret=${JWT_SECRET:MonomatJwtSecretKeyForLocalDevOnly_ChangeMe_AtLeast32Bytes}
auth.jwt.access-token-validity-seconds=${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:900}
auth.jwt.refresh-token-validity-seconds=${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:2592000}
auth.session.max-active-per-user-registered=${AUTH_SESSION_MAX_ACTIVE_PER_USER_REGISTERED:1}
auth.session.max-active-per-user-guest=${AUTH_SESSION_MAX_ACTIVE_PER_USER_GUEST:2}
auth.session.cleanup-fixed-delay-ms=${AUTH_SESSION_CLEANUP_FIXED_DELAY_MS:600000}
auth.session.inactive-retention-days=${AUTH_SESSION_INACTIVE_RETENTION_DAYS:7}
auth.network.trust-forwarded-headers=${AUTH_NETWORK_TRUST_FORWARDED_HEADERS:false}

# CORS 허용 출처 (프론트엔드 도메인). 콤마로 구분.
# 기본값은 로컬 개발용. prod는 서버 .env의 CORS_ALLOWED_ORIGINS로 주입(예: https://monomat.games,https://www.monomat.games).
monomat.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# YouTube oEmbed 호출 타임아웃 (Spring Boot Duration 형식: 2s, 500ms 등)
youtube.oembed.connect-timeout=${YOUTUBE_OEMBED_CONNECT_TIMEOUT:2s}
youtube.oembed.request-timeout=${YOUTUBE_OEMBED_REQUEST_TIMEOUT:5s}
# 단건/batch 공통 동시 oEmbed 호출 상한 (YouTube rate/timeout 폭주 방지)
youtube.oembed.batch-concurrency=${YOUTUBE_OEMBED_BATCH_CONCURRENCY:8}
# permit(전역 동시성) 대기 상한. 초과 시 외부 호출 없이 503으로 빠르게 실패. Spring Boot Duration 형식.
# 정상 대형 배치의 tail 대기(≈ 문제수/동시성 × 호출 지연)를 넘도록 request-timeout보다 넉넉히 둔다.
youtube.oembed.queue-timeout=${YOUTUBE_OEMBED_QUEUE_TIMEOUT:10s}

# 로비 최근 채팅 조회 정책
chat.lobby.recent-messages.max-size=${LOBBY_RECENT_CHAT_MAX_SIZE:50}
chat.lobby.recent-messages.ttl=${LOBBY_RECENT_CHAT_TTL:2h}

# 로비 목록/상세 닉네임 캐시 TTL (Spring Boot Duration 형식: 10m, 5m, 30m 등)
# 호출 빈도 높은 GET /api/lobbies에서 닉네임 DB 조회를 줄이기 위한 cache-aside TTL
monomat.lobby.nickname-cache.ttl=${LOBBY_NICKNAME_CACHE_TTL:10m}

# 빈 로비 자동 폭파(reaper) 정책
# fixed-delay-ms: 이전 실행 종료 후 다음 스캔까지의 간격(ms)
# grace-ms: 생성 직후 폭파를 보류할 보호 기간(ms). 생성->WebSocket 구독 갭보다 충분히 커야 한다.
monomat.lobby.reaper.fixed-delay-ms=${LOBBY_REAPER_FIXED_DELAY_MS:60000}
monomat.lobby.reaper.grace-ms=${LOBBY_REAPER_GRACE_MS:120000}

# 신고 정책
# lobby-review-threshold: 특정 로비의 PENDING 신고 수가 이 값 이상이면 관리자 검토 대상
# auto-private-enabled: true일 경우 후속 정책에서 자동 비공개 전환 후보로 판단 가능
report.policy.lobby-review-threshold=${REPORT_POLICY_LOBBY_REVIEW_THRESHOLD:5}
report.policy.auto-private-enabled=${REPORT_POLICY_AUTO_PRIVATE_ENABLED:false}

# 관리자 접근 fallback 정책
# 관리자 API 접근은 기본적으로 admin_users 테이블을 기준으로 판단한다.
# 이 값은 DB 장애 또는 local/dev 긴급 접근을 위한 fallback allow-list다.
# 여러 명은 콤마로 구분한다. 예: 1,2
monomat.admin.user-ids=${MONOMAT_ADMIN_USER_IDS:}

# 게임 세션 정체(stale) 판별 임계 기간.
# 새 게임 시작 시 동일 로비의 미종료 active 세션이 이 기간을 넘겼으면 비정상 정체로 보고 복구(강제 종료)한다.
monomat.game.session.stale-threshold=${GAME_SESSION_STALE_THRESHOLD:30m}

# 게임 세션 Redis 키 TTL
# 게임 세션 본체, 라운드 데이터, 맵 플레이 횟수 중복 집계 방지 키가 동일한 TTL을 사용한다.
monomat.game.session.redis-ttl=${GAME_SESSION_REDIS_TTL:2h}

# Flyway: 모든 스키마 변경은 src/main/resources/db/migration 의 Vn__*.sql 로만 관리.
# baseline-on-migrate=true: 기존 운영/dev DB(이미 ddl-auto/수동 ALTER 로 만들어진 스키마)에 처음 적용될 때
#   schema_history 테이블만 생성하고 baseline-version까지를 실행 없이 baseline 으로 마킹한다.
# baseline-version=2: V1(Monomat_ERD.sql) + V2(map_item active_order_num) 가 기존 환경에 이미 적용된
#   상태를 baseline 으로 본다. 즉 V3 부터 Flyway 가 실제 적용한다.
# 새로 띄우는 환경은 Monomat_ERD.sql 한 번 수동 적용 후 앱 기동 → baseline 마킹 → V3+ 자동 적용 (CLAUDE.md 참조).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.locations=classpath:db/migration
