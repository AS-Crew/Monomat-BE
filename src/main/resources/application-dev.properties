#==========================================
#  Develop 환경 설정 파일
#==========================================
# 1. Database 설정 (OCI MySQL 8.x DB)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# 2. dotenv 환경 변수 설정
spring.datasource.url=${OCI_DB_URL}
spring.datasource.username=${OCI_DB_USERNAME}
spring.datasource.password=${OCI_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10


# 3. JPA / Hibernate 설정
# 스키마 변경은 Flyway가 단일 권한. Hibernate는 entity ↔ DB 정합성 검증만 수행한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# 4. Redis 설정
spring.data.redis.host=${OCI_REDIS_HOST}
spring.data.redis.port=${OCI_REDIS_PORT}
spring.data.redis.password=${OCI_REDIS_PASSWORD}


# 5. 로깅 설정
# Spring Boot 4.x: SQL + 바인딩 파라미터 로그
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


# 6. Java Virtual Thread 활성화
spring.threads.virtual.enabled=true


# 7. Swagger UI (dev 전용)
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.url=/v3/api-docs